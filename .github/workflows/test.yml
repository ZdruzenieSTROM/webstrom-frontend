name: branch test
run-name: Branch test of ${{ github.head_ref || github.ref_name }} (${{ github.actor }}'s PR)
on:
  push:
    branches: master
  pull_request:
  workflow_dispatch:
jobs:
  branch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch code
        uses: actions/checkout@v7
      # bun only installs and typechecks; next, eslint and vitest still run on Node
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # no package cache: restoring ~/.bun/install/cache measured slower than a fresh bun install
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run typecheck
        run: bun run typecheck
      - name: Run ESLint
        run: bun run lint
      # `bun run test` runs the vitest script; `bun test` would start Bun's own test runner instead
      - name: Run tests
        run: bun run test
      # Turbopack persists its build cache to .next/cache; without restoring it every CI build is cold
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('bun.lock') }}-
      - name: Run build
        run: bun run build
      # Only master saves: a PR's cache is readable by that PR alone, and ~160 MB per push would
      # crowd master's entry out of the repo's 10 GB Actions cache quota
      - name: Save Next.js build cache
        if: github.ref == 'refs/heads/master' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
