name: branch test
run-name: Branch test of ${{ github.head_ref || github.ref_name }} (${{ github.actor }}'s PR)
on:
  push:
    branches: master
  pull_request:
  workflow_dispatch:
jobs:
  branch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch code
        uses: actions/checkout@v7
      - name: Setup Node.js with Yarn cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn
      - name: Run typecheck
        run: yarn tsc
      - name: Run ESLint
        run: yarn lint
      - name: Run tests
        run: yarn test
      # Turbopack persists its build cache to .next/cache; without restoring it every CI build is cold
      - name: Restore Next.js build cache
        id: next-cache
        uses: actions/cache/restore@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
      - name: Run build
        run: yarn build
      # Only master saves: a PR's cache is readable by that PR alone, and ~160 MB per push would
      # crowd master's entry out of the repo's 10 GB Actions cache quota
      - name: Save Next.js build cache
        if: github.ref == 'refs/heads/master' && steps.next-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: .next/cache
          key: ${{ steps.next-cache.outputs.cache-primary-key }}
