name: branch test
run-name: Branch test of ${{ github.head_ref || github.ref_name }} (${{ github.actor }}'s PR)
on:
  push:
    branches: master
  pull_request:
  workflow_dispatch:
jobs:
  branch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch code
        uses: actions/checkout@v7
      - name: Setup Node.js with Yarn cache
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
      - name: Install dependencies
        run: yarn
      - name: Run typecheck
        run: yarn tsc
      - name: Run ESLint
        run: yarn lint
      - name: Run tests
        run: yarn test
      # Turbopack persists its build cache to .next/cache; without restoring it every CI build is cold
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: nextjs-${{ runner.os }}-${{ hashFiles('yarn.lock') }}-
      - name: Run build
        run: yarn build
