name: branch test
run-name: Branch test of ${{ github.head_ref || github.ref_name }} (${{ github.actor }}'s PR)
on:
  push:
    branches: master
  pull_request:
  workflow_dispatch:
jobs:
  branch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch code
        uses: actions/checkout@v4
      # bun only installs and typechecks; next, eslint and vitest still run on Node
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      # no package cache: restoring ~/.bun/install/cache measured slower than a fresh bun install
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run typecheck
        run: bun check
      - name: Run ESLint
        run: bun run lint
      # `bun run test` runs the vitest script; `bun test` would start Bun's own test runner instead
      - name: Run tests
        run: bun run test
      - name: Run build
        run: bun run build
